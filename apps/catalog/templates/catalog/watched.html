{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineScope | Filmes Assistidos</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131b; color: #f4f5f7; }
        body { margin: 0; }
        header { padding: 2rem max(1rem, calc((100% - 1100px) / 2)); background: #191e2b; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: #f5c518; }
        .btn-nav { background: #252b39; color: #f4f5f7; border: 1px solid #363f54; padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none; font-weight: bold; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .movies { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.25rem; }
        article { overflow: hidden; border-radius: .75rem; background: #191e2b; display: flex; flex-direction: column; justify-content: space-between; }
        article img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #252b39; }
        article h2 { margin: .75rem; font-size: 1rem; }
        .message { padding: 1rem; border-radius: .5rem; background: #252b39; }
        
        .actions-grid { padding: 0.5rem .75rem .75rem; }
        .btn-remove { background: #cf222e; color: #ffffff; border: none; padding: 0.35rem; border-radius: 0.35rem; font-size: 0.8rem; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>CineScope</h1>
            <p style="margin: 0; color: #c2c7d0;">Filmes que já Assisti 👁️</p>
        </div>
        <a href="/" class="btn-nav">🏠 Voltar ao Catálogo</a>
    </header>
    
    <main>
        <section id="watched-container" class="movies" aria-label="Filmes Assistidos">
        </section>
        
        <p id="empty-message" class="message" style="display: none;">Você ainda não marcou nenhum filme como assistido.</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('watched-container');
            const emptyMessage = document.getElementById('empty-message');
            const watchedList = JSON.parse(localStorage.getItem('cinescope.watched')) || [];
            
            if (watchedList.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }
            
            watchedList.forEach(movie => {
                const article = document.createElement('article');
                article.id = `movie-card-${movie.id}`;
                
                const posterImg = movie.poster_path 
                    ? `<img src="https://tmdb.org{movie.poster_path}" alt="Pôster de ${movie.title}">`
                    : `<div style="width: 100%; aspect-ratio: 2 / 3; background: #252b39; display: flex; align-items: center; justify-content: center; color: #c2c7d0;">Sem foto</div>`;
                
                article.innerHTML = `
                    <div>
                        ${posterImg}
                        <h2>${movie.title}</h2>
                    </div>
                    <div class="actions-grid">
                        <button class="btn-remove" onclick="removeWatched(${movie.id})">❌ Remover da Lista</button>
                    </div>
                `;
                container.appendChild(article);
            });
        });

        function removeWatched(movieId) {
            let watchedList = JSON.parse(localStorage.getItem('cinescope.watched')) || [];
            watchedList = watchedList.filter(item => item.id !== movieId);
            localStorage.setItem('cinescope.watched', JSON.stringify(watchedList));
            
            document.getElementById(`movie-card-${movieId}`).remove();
            
            if (watchedList.length === 0) {
                document.getElementById('empty-message').style.display = 'block';
            }
        }
    </script>
</body>
</html>
