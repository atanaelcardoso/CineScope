<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineScope | Filmes populares</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131b; color: #f4f5f7; }
        body { margin: 0; }
        header { padding: 2rem max(1rem, calc((100% - 1100px) / 2)); background: #191e2b; }
        h1 { margin: 0; color: #f5c518; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .movies { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.25rem; }
        article { overflow: hidden; border-radius: .75rem; background: #191e2b; }
        article img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #252b39; }
        article h2, article p { margin: .75rem; }
        article h2 { font-size: 1rem; }
        article p { color: #c2c7d0; font-size: .9rem; line-height: 1.45; }
        .message { padding: 1rem; border-radius: .5rem; background: #252b39; }
    </style>
</head>
<body>
    <header>
        <h1>CineScope</h1>
        <p>Filmes populares</p>
    </header>
    <main>
        {% if error %}
            <p class="message" role="alert">{{ error }}</p>
        {% elif movies %}
            <section class="movies" aria-label="Filmes populares">
                {% for movie in movies %}
                    <article>
                        {% if movie.poster_path %}
                            <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" alt="Pôster de {{ movie.title }}" loading="lazy">
                        {% endif %}
                        <h2>{{ movie.title }}</h2>
                        {% if movie.overview %}
                            <p>{{ movie.overview }}</p>
                        {% endif %}
                    </article>
                {% endfor %}
            </section>
        {% else %}
            <p class="message">Nenhum filme popular foi encontrado.</p>
        {% endif %}
    </main>
</body>
</html>
