services:
  db:
    image: postgres:14
    container_name: cinescope_db_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cinescope_web_container
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./static:/app/static
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.0
    container_name: cinescope_aws_container
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sns,lambda
      - AWS_DEFAULT_REGION=us-east-1
      - DEPLOY_PRO=0
    volumes:
      - "./infrastructure/localstack:/etc/localstack/init/ready.d"
      - "localstack_data:/var/lib/localstack"

volumes:
  postgres_data:
  localstack_data:
